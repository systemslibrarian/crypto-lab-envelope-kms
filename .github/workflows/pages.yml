name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The vitest suite: envelope wrap/unwrap, the key-wrap primitive, the
      # KMS API, the audit log, byte helpers and the security properties —
      # 63 tests across 9 files. Deploy previously ran only test:a11y, so
      # none of it gated a publish: a build whose envelope decryption was
      # broken could ship as long as the page passed axe.
      #
      # Deliberately npm test and not npm run ci — the ci script chains lint,
      # which is red on main (two no-unused-vars errors in e2e/gate.ts, from
      # ca23ff2). Wiring that in would block every future publish. The lint
      # failure is a separate repair.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
